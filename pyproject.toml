[project]
name = "auction-vosk-demo"
version = "0.1.0"
description = "Voice-driven auction bid demo: Vosk pt-BR ASR + Brazilian Portuguese bid NLU"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-sock>=0.7.0",
    "vosk>=0.3.45",
    "numpy>=2.0",
]

[project.scripts]
auction-demo = "auction_demo.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auction_demo"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model: requires a downloaded Vosk model (skipped when missing)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
